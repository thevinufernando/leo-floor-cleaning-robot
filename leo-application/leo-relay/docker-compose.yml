services:
  leo-relay:
    build: .
    container_name: leo-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LEO_RELAY_TOKEN: ${LEO_RELAY_TOKEN:-change-me-demo-token}
      MOCK_MAP: ${MOCK_MAP:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
