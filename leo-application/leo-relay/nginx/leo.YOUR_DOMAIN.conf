# Leo Relay — Nginx subdomain snippet
#
# 1. Create DNS A/CNAME: leo.YOUR_DOMAIN -> this server
# 2. Place this file (or include it) under sites-available and enable it
# 3. Issue TLS (certbot) for leo.YOUR_DOMAIN
# 4. docker compose up -d in leo-application/leo-relay
#
# Replace YOUR_DOMAIN and adjust upstream port if you change compose mapping.

upstream leo_relay_upstream {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name leo.YOUR_DOMAIN;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name leo.YOUR_DOMAIN;

    # ssl_certificate     /etc/letsencrypt/live/leo.YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leo.YOUR_DOMAIN/privkey.pem;

    location /health {
        proxy_pass http://leo_relay_upstream;
        proxy_http_version 1.1;
    }

    location /ws {
        proxy_pass http://leo_relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://leo_relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
